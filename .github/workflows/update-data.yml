name: Actualizar datos legislativos

on:
  schedule:
    # Todos los días a las 09:00 UTC (06:00 hora Argentina)
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # también se puede disparar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Correr ETL Diputados
        run: python etl_diputados.py
        continue-on-error: true  # si HCDN cambia de formato, no queremos que se frene todo el pipeline

      - name: Correr ETL Senado
        run: python etl_senado.py
        continue-on-error: true

      - name: Exportar a JSON del frontend
        run: python export_to_json.py

      - name: Commitear cambios si hay datos nuevos
        run: |
          git config user.name "control-ciudadano-bot"
          git config user.email "actions@users.noreply.github.com"
          git add control-ciudadano-app/public/data/legisladores.json control_ciudadano.db
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos — no hay nada que commitear."
          else
            git commit -m "Actualización automática de datos legislativos ($(date -u +%Y-%m-%d))"
            git push
          fi
